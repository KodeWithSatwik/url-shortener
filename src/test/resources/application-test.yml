spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  base-url: http://localhost:8080
  default-ttl-days: 30
  short-code:
    length: 6
    max-retries: 5
  rate-limit:
    capacity: 1000
    refill-tokens: 1000
    refill-seconds: 1

logging:
  level:
    com.urlshortener: WARN
