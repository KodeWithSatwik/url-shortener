spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

app:
  base-url: ${APP_BASE_URL}
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-seconds: 60

# In prod, never expose DB connection details through the health endpoint
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info  # exclude metrics from public exposure in prod

logging:
  level:
    com.urlshortener: INFO
