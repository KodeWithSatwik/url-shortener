---
# secret.example.yaml — Template for Kubernetes Secrets
#
# INSTRUCTIONS:
#   1. Copy this file: cp k8s/secret.example.yaml k8s/secret.yaml
#   2. Base64-encode your real values:
#        echo -n 'your_actual_password' | base64
#   3. Replace <BASE64_ENCODED_...> placeholders below with your encoded values
#   4. Apply: kubectl apply -f k8s/secret.yaml
#   5. NEVER commit secret.yaml to version control (.gitignore already excludes it)
#
# Production recommendation:
#   Use an external secrets manager (AWS Secrets Manager, HashiCorp Vault,
#   or Kubernetes External Secrets Operator) to inject secrets at deploy time
#   rather than storing base64 values in any file.

apiVersion: v1
kind: Secret
metadata:
  name: urlshortener-secret
  labels:
    app: urlshortener
type: Opaque
data:
  # echo -n 'your_db_username' | base64
  DATABASE_USER: <BASE64_ENCODED_DB_USER>

  # echo -n 'your_db_password' | base64
  DATABASE_PASSWORD: <BASE64_ENCODED_DB_PASSWORD>
